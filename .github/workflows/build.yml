name: Build APK

on:
  push:
    branches: [main, next]
    # Only documents changed: nothing to build or release.
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE"]
  workflow_dispatch:

# Nothing gets write access unless a job asks for it below
permissions:
  contents: read

jobs:
  # Builds and tests. Runs third-party build code, so it gets no secrets and no write access.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Check version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(tr -d '[:space:]' < version.txt)"
          # minor and patch below 100, so versionCode (major·10000 + minor·100 + patch) never collides
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]{1,2}\.[0-9]{1,2}$' || { echo "::error::version.txt must be major.minor.patch (minor, patch < 100), got '$V'"; exit 1; }
          # A push to main becomes a release: stop here, before any approval, if this version is already out.
          if [ "${{ github.event_name }}" = push ] && [ "${{ github.ref }}" = refs/heads/main ] \
             && gh api "repos/${{ github.repository }}/releases/tags/v$V" >/dev/null 2>&1; then
            echo "::error::v$V is already released; raise version.txt first."; exit 1
          fi

      - name: Check strings (unescaped apostrophes)
        run: bash .github/check-strings.sh

      # Too large for Git (over 100 MB): downloaded from a fixed revision, then checked below
      - name: Download the dictation model
        run: |
          curl -fsSL --retry 3 --proto '=https' -o app/src/main/assets/voice/ggml-small-q5_1.bin \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/f281eb45af861ab5e5297d23694b7d46e090c02c/ggml-small-q5_1.bin"

      - name: Check the built-in models (exact pinned files)
        run: |
          (cd app/src/main/assets/voice && sha256sum -c SHA256SUMS)
          (cd app/src/main/assets/ocr && sha256sum -c SHA256SUMS)

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      # The Gradle wrapper jar comes from upstream: check it is an official one before running it.
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # whisper.cpp is built with CMake and Ninja
      - name: Set up Ninja
        run: sudo apt-get install -y -qq ninja-build

      - name: Test and build (unsigned)
        shell: bash
        run: |
          set -o pipefail
          # Every library is checked against gradle/verification-metadata.xml (refreshed only by deps.yml);
          # the build fails on any changed library, and without the file.
          test -f gradle/verification-metadata.xml || { echo "gradle/verification-metadata.xml is missing" | tee build.log; exit 1; }
          ./gradlew --no-daemon :app:testDebugUnitTest --tests 'ua.pysanka.*' assembleRelease 2>&1 | tee build.log

      - name: Check permissions (no internet, only what is expected)
        shell: bash
        run: bash .github/check-permissions.sh app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Prepare build log
        if: always()
        shell: bash
        run: |
          mkdir -p log
          { echo "run ${{ github.run_number }} ${{ job.status }}"; grep -E "^e: |error:|FAILED|What went wrong|Dependency verification" -A3 build.log | head -300; echo ----; tail -150 build.log; cat permissions.txt 2>/dev/null; } > log/build.log || true
          find app/build/test-results -name "*.xml" -exec cp {} log/ \; 2>/dev/null || true
          cp gradle/verification-metadata.xml log/ 2>/dev/null || true
          # Pictures of the screens drawn with made-up texts, for review
          cp -r app/build/screens log/screens 2>/dev/null || true
          # Room writes the schema of a new database version during the build; keep it so it can be committed
          cp -r app/schemas log/ 2>/dev/null || true
          # The first errors as annotations, so they show on the pull request without opening the log.
          { grep -E "^e: |What went wrong|FAILED|AssertionError|expected:|PROBLEM:|On artifact" -A2 build.log 2>/dev/null | grep -v "^--$" | head -15 \
            | sed -E 's/%/%25/g' | while IFS= read -r l; do echo "::warning title=build::$l"; done; } || true
          grep -h -o -E '<failure message="[^"]{0,300}' app/build/test-results/*/*.xml 2>/dev/null | head -5 \
            | while IFS= read -r l; do echo "::warning title=test::${l#<failure message=\"}"; done || true

      # The same log, packed into this job's own output (read with the GitHub API), so no branch
      # is needed for it: lines "PYSANKA-LOG <base64 of a tar.gz>"
      - name: Print the log for review
        if: always()
        shell: bash
        run: |
          # Without the dependency list (large; the deps workflow has it); over 6 MB, without the screens
          tar -C log --exclude=./verification-metadata.xml -czf "$RUNNER_TEMP/log.tgz" . || true
          if [ "$(stat -c %s "$RUNNER_TEMP/log.tgz" 2>/dev/null || echo 0)" -gt 6000000 ]; then
            tar -C log --exclude=./verification-metadata.xml --exclude=./screens -czf "$RUNNER_TEMP/log.tgz" . || true
          fi
          base64 -w 4000 "$RUNNER_TEMP/log.tgz" | sed 's/^/PYSANKA-LOG /' || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: build-log
          retention-days: 7
          path: log/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pysanka-unsigned
          retention-days: 7
          path: app/build/outputs/apk/release/app-release-unsigned.apk

  # Signs. Only for main, only in the "release" environment (needs the owner's approval), and with
  # no Gradle or other third-party build code: just the Android SDK's own zipalign and apksigner.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      signed: ${{ steps.secrets.outputs.ready }}
    steps:
      - name: Check that signing secrets exist
        id: secrets
        env:
          KEYSTORE: ${{ secrets.PYSANKA_KEYSTORE }}
          PASS: ${{ secrets.PYSANKA_SIGNING_PASS }}
          STORE: ${{ secrets.PYSANKA_STORE_PASS }}
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$PASS" ] && [ -n "$STORE" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Signing secrets are not set in the release environment; nothing is published."
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: steps.secrets.outputs.ready == 'true'
        with:
          persist-credentials: false
          sparse-checkout: |
            .github

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.secrets.outputs.ready == 'true'
        with:
          name: pysanka-unsigned
          path: unsigned

      # The build job ran third-party code: check the APK's permissions again here, before signing,
      # in a step that has no secrets.
      - name: Check permissions again
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        run: bash .github/check-permissions.sh unsigned/app-release-unsigned.apk

      - name: Sign
        if: steps.secrets.outputs.ready == 'true'
        env:
          KEYSTORE: ${{ secrets.PYSANKA_KEYSTORE }}
          PASS: ${{ secrets.PYSANKA_SIGNING_PASS }}
          STORE: ${{ secrets.PYSANKA_STORE_PASS }}
        shell: bash
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          # The key lives only in the release environment's secrets, never in the repository: the
          # encrypted key file (base64) and its password, decrypted here only for signing
          printf %s "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/pysanka.jks.enc"
          printf %s "$PASS" > "$RUNNER_TEMP/p"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in "$RUNNER_TEMP/pysanka.jks.enc" -out "$RUNNER_TEMP/pysanka.jks" -pass file:"$RUNNER_TEMP/p"
          rm -f "$RUNNER_TEMP/p" "$RUNNER_TEMP/pysanka.jks.enc"
          mkdir -p out
          "$BT/zipalign" -P 16 -f 4 unsigned/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          OUT="out/pysanka-$(tr -d '[:space:]' < version.txt).apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/pysanka.jks" --ks-key-alias pysanka \
            --ks-pass env:STORE --key-pass env:STORE --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/pysanka.jks"
          # The certificate must be exactly Pysanka's own (.github/signing-certificate-sha256.txt)
          CERT="$(tr -d '[:space:]' < .github/signing-certificate-sha256.txt)"
          "$BT/apksigner" verify --print-certs "$OUT" | tee certs.txt
          if ! tr -d ' ' < certs.txt | grep -qi "SHA-256digest:$CERT"; then
            echo "::error::Unexpected signing certificate"; exit 1
          fi

      - name: Remove the decrypted key
        if: always()
        run: rm -f "$RUNNER_TEMP/pysanka.jks" "$RUNNER_TEMP/pysanka.jks.enc" "$RUNNER_TEMP/p"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          name: pysanka-signed
          retention-days: 7
          path: out/*.apk

  # Publishes the signed APK. Never sees the signing key; uses only GitHub's own gh tool.
  publish:
    needs: release
    if: needs.release.outputs.signed == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          sparse-checkout: |
            .github/release-notes.md
            version.txt
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pysanka-signed
          path: out
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The same version can be released only once: the tag already exists otherwise.
          V="$(tr -d '[:space:]' < version.txt)"
          gh release create "v$V" out/*.apk \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Pysanka $V" --notes-file .github/release-notes.md --latest
